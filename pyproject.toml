[project]
name = "statustw-discord-bot"
version = "1.0.0"
description = "Discord bot that announces when watched Teeworlds players come online, using the status.tw API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
